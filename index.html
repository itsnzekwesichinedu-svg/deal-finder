<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deal Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f4ef;
      --panel: #ffffff;
      --panel-strong: #fcfbf8;
      --line: #e7e2d9;
      --line-strong: #d9d1c2;
      --text: #1f2528;
      --muted: #6f7a7e;
      --accent: #b89144;
      --accent-ink: #1d1811;
      --chip: #f4f0e8;
      --shadow: 0 14px 34px rgba(24, 30, 33, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 34px;
      color: var(--text);
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 8% 10%, rgba(184, 145, 68, 0.08), transparent 34%),
        linear-gradient(180deg, #f8f6f1 0%, #f3f1eb 68%, #f1eee8 100%);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image: radial-gradient(rgba(0, 0, 0, 0.25) 0.7px, transparent 0.7px);
      background-size: 4px 4px;
      z-index: 0;
    }

    .page {
      width: min(1240px, 100%);
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero {
      margin-bottom: 16px;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-family: "DM Mono", monospace;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4.2vw, 2.7rem);
      line-height: 1.06;
      letter-spacing: 0.005em;
      font-weight: 700;
    }

    .sub {
      margin: 9px 0 0;
      max-width: 860px;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .controls {
      padding: 18px;
      position: sticky;
      top: 10px;
    }

    .results-panel {
      padding: 16px;
      min-height: 420px;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 0.72rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: "DM Mono", monospace;
    }

    .field-grid {
      display: grid;
      gap: 11px;
    }

    .field-grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.69rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: "DM Mono", monospace;
    }

    input,
    select,
    button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 11px 12px;
      color: var(--text);
      background: #fff;
      font: inherit;
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      font-family: "DM Mono", monospace;
      font-size: 0.86rem;
    }

    input::placeholder {
      color: #8d999d;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(184, 145, 68, 0.16);
    }

    button {
      margin-top: 6px;
      border: none;
      background: linear-gradient(135deg, #c7a259, #b98f43);
      color: var(--accent-ink);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.11em;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 6px 16px rgba(94, 68, 22, 0.18);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .button-row {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .button-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line-strong);
      box-shadow: none;
    }

    .results-topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 12px;
    }

    .results-topbar h2 {
      margin: 0;
      font-size: clamp(1.2rem, 1.8vw, 1.5rem);
      font-weight: 700;
      letter-spacing: 0.004em;
    }

    .results-meta {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
      text-align: right;
      font-family: "DM Mono", monospace;
    }

    .status {
      margin: 0 0 12px;
      color: var(--muted);
      min-height: 22px;
      font-size: 0.8rem;
      font-family: "DM Mono", monospace;
    }

    .status.loading::after {
      content: "";
      display: inline-block;
      width: 1.1em;
      animation: loadingDots 1.2s steps(4, end) infinite;
    }

    @keyframes loadingDots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
      100% { content: ""; }
    }

    .subtle-note {
      margin: -2px 0 10px;
      color: var(--muted);
      font-size: 0.74rem;
      opacity: 0.9;
      min-height: 16px;
      font-family: "DM Mono", monospace;
      letter-spacing: 0.01em;
    }

    .results {
      column-count: 2;
      column-gap: 12px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 10px;
      background: var(--panel-strong);
      display: inline-block;
      width: 100%;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
      margin: 0 0 12px;
      break-inside: avoid;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(140deg, rgba(184, 145, 68, 0.06), transparent 48%);
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      background: #fff;
      box-shadow: 0 12px 22px rgba(25, 33, 37, 0.11);
    }

    .card-media {
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 12px;
      border: 1px solid var(--line);
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(35, 41, 44, 0.08), rgba(35, 41, 44, 0.02)),
        repeating-linear-gradient(
          45deg,
          rgba(184, 145, 68, 0.08) 0,
          rgba(184, 145, 68, 0.08) 8px,
          rgba(184, 145, 68, 0.04) 8px,
          rgba(184, 145, 68, 0.04) 16px
        );
      margin-bottom: 10px;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .card:hover .card-media img {
      transform: scale(1.02);
    }

    .card-media.no-image {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .card-media.no-image::after {
      content: "No Image Preview";
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.65);
    }

    .card-body {
      padding: 2px 6px 6px;
    }

    .card-title {
      margin: 0 0 8px;
      font-size: clamp(0.96rem, 1.1vw, 1.08rem);
      line-height: 1.34;
      font-weight: 600;
      max-width: 44ch;
    }

    .card-meta,
    .card-note {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.5;
      font-family: "DM Mono", monospace;
    }

    .chips {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .chip {
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--chip);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.65rem;
      letter-spacing: 0.065em;
      text-transform: uppercase;
      font-variant: all-small-caps;
      font-family: "DM Mono", monospace;
      font-weight: 500;
    }

    .price-block {
      margin: 10px 0 8px;
      text-align: left;
    }

    .total {
      display: block;
      font-size: clamp(1.4rem, 2vw, 1.8rem);
      line-height: 1;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .price-detail {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.64rem;
      line-height: 1.35;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-family: "DM Mono", monospace;
    }

    .empty {
      padding: 22px 18px;
      border: 1px dashed var(--line-strong);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
      background: #f8f5ef;
      font-family: "DM Mono", monospace;
      font-size: 0.8rem;
    }

    .source-stats {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .stat {
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--chip);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.66rem;
      font-family: "DM Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.055em;
    }

    .stat.timeout {
      background: #efe8dc;
      border-color: #dfd2bd;
      color: #867866;
      opacity: 0.9;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .controls {
        position: static;
      }

      .results {
        column-count: 1;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 12px 10px 20px;
      }

      .hero,
      .controls,
      .results-panel {
        padding: 14px;
      }

      h1 {
        font-size: clamp(1.45rem, 8vw, 2rem);
      }

      .sub {
        font-size: 0.87rem;
      }

      .field-grid.two {
        grid-template-columns: 1fr;
      }

      .results-topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .results-meta,
      .price-block {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <p class="eyebrow">Live Resale Search</p>
      <h1>Deal Finder</h1>
      <p class="sub">
        Pull live resale results from multiple marketplaces, filter the noise, and sort by the cheapest real total.
      </p>
    </section>

    <div class="layout">
      <aside class="panel controls">
        <p class="section-title">Search Setup</p>
        <div class="field-grid">
          <div>
            <label for="item">Item</label>
            <input id="item" type="text" placeholder="levis 501 w40" />
          </div>
          <div>
            <label for="location">Location</label>
            <input id="location" type="text" placeholder="Madrid" />
          </div>
          <div>
            <label for="imageInput">Reference Image</label>
            <input id="imageInput" type="file" accept="image/*" />
          </div>
        </div>

        <p class="section-title" style="margin-top: 20px;">Filters</p>
        <div class="field-grid two">
          <div>
            <label for="platform">Platform</label>
            <select id="platform">
              <option value="all">All</option>
              <option value="Vinted">Vinted</option>
              <option value="eBay">eBay</option>
              <option value="Wallapop">Wallapop</option>
              <option value="Grailed">Grailed</option>
              <option value="Vestiaire Collective">Vestiaire Collective</option>
            </select>
          </div>
          <div>
            <label for="sort">Sort</label>
            <select id="sort">
              <option value="lowest-total">Lowest Total</option>
              <option value="best-match">Best Match</option>
              <option value="price-only">Lowest Item Price</option>
            </select>
          </div>
          <div>
            <label for="maxPrice">Max Total</label>
            <input id="maxPrice" type="number" min="0" step="0.01" placeholder="80" />
          </div>
          <div>
            <label for="size">Size</label>
            <input id="size" type="text" placeholder="w40 / xl / 32" />
          </div>
          <div>
            <label for="condition">Condition</label>
            <select id="condition">
              <option value="all">All</option>
              <option value="new">New</option>
              <option value="very good">Very Good</option>
              <option value="good">Good</option>
            </select>
          </div>
          <div>
            <label for="excludeWords">Exclude Words</label>
            <input id="excludeWords" type="text" placeholder="shorts women kids" />
          </div>
        </div>

        <div class="button-row">
          <button id="searchButton" type="button">Run Search</button>
          <button id="resetButton" class="button-secondary" type="button">Reset Filters</button>
        </div>

        <div class="source-stats" id="sourceStats"></div>
      </aside>

      <main class="panel results-panel">
        <div class="results-topbar">
          <div>
            <p class="section-title">Results</p>
            <h2 id="resultsTitle">Ready to search</h2>
          </div>
          <div class="results-meta" id="resultsMeta">No search yet.</div>
        </div>

        <p class="status" id="status">Try something specific like "levis 501 w40".</p>
        <p class="subtle-note" id="relaxedNotice"></p>
        <div class="results" id="results"></div>
      </main>
    </div>
  </div>

  <script>
    const fields = {
      item: document.getElementById('item'),
      location: document.getElementById('location'),
      platform: document.getElementById('platform'),
      sort: document.getElementById('sort'),
      maxPrice: document.getElementById('maxPrice'),
      size: document.getElementById('size'),
      condition: document.getElementById('condition'),
      excludeWords: document.getElementById('excludeWords')
    };
    const imageInputEl = document.getElementById('imageInput');

    const resultsEl = document.getElementById('results');
    const statusEl = document.getElementById('status');
    const relaxedNoticeEl = document.getElementById('relaxedNotice');
    const resultsTitleEl = document.getElementById('resultsTitle');
    const resultsMetaEl = document.getElementById('resultsMeta');
    const sourceStatsEl = document.getElementById('sourceStats');
    let activeStream = null;
    let latestImageInference = null;
    let imageInferenceWarning = '';
    let envDebug = null;

    function setLoadingState(isLoading, message = '') {
      statusEl.classList.toggle('loading', Boolean(isLoading));
      if (message) {
        statusEl.textContent = message;
      }
    }

    function formatMoney(value) {
      return new Intl.NumberFormat('en-GB', {
        style: 'currency',
        currency: 'EUR'
      }).format(value);
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getSafeImageUrl(value) {
      const url = String(value || '').trim();
      if (!url) {
        return '';
      }
      if (/^https?:\/\//i.test(url)) {
        return url;
      }
      return '';
    }

    async function loadEnvDebug() {
      try {
        const res = await fetch('/debug/env');
        if (!res.ok) {
          return;
        }
        envDebug = await res.json();
      } catch (error) {
        envDebug = null;
      }
    }

    function getParams() {
      const params = new URLSearchParams();

      Object.entries(fields).forEach(([key, input]) => {
        const value = input.value.trim();
        if (value && value !== 'all') {
          params.set(key, value);
        }
      });

      return params;
    }

    function renderStats(meta) {
      sourceStatsEl.innerHTML = '';

      if (!meta || !meta.sources) {
        return;
      }

      const stats = [
        `Vinted: ${meta.sources.vinted}`,
        `eBay: ${meta.sources.ebay}`,
        `Wallapop: ${meta.sources.wallapop || 0}`,
        `Grailed: ${meta.sources.grailed || 0}`,
        `Vestiaire: ${meta.sources.vestiaireCollective || 0}`,
        `Shown: ${meta.totalFound}`
      ];

      stats.forEach((text) => {
        const chip = document.createElement('div');
        chip.className = 'stat';
        chip.textContent = text;
        sourceStatsEl.appendChild(chip);
      });

      const timedOutSources = Object.entries(meta.timeouts || {})
        .filter(([, timedOut]) => Boolean(timedOut))
        .map(([key]) => key);

      const sourceLabels = {
        vinted: 'Vinted',
        ebay: 'eBay',
        wallapop: 'Wallapop',
        grailed: 'Grailed',
        vestiaireCollective: 'Vestiaire'
      };

      timedOutSources.forEach((sourceKey) => {
        const chip = document.createElement('div');
        chip.className = 'stat timeout';
        chip.textContent = `${sourceLabels[sourceKey] || sourceKey} timed out`;
        sourceStatsEl.appendChild(chip);
      });

      if (meta.skipped && meta.skipped.ebay) {
        const chip = document.createElement('div');
        chip.className = 'stat timeout';
        chip.textContent = 'eBay disabled';
        sourceStatsEl.appendChild(chip);
      }

      if (meta.sizeMappingUsed) {
        const chip = document.createElement('div');
        chip.className = 'stat timeout';
        chip.textContent = 'Size mapping used';
        sourceStatsEl.appendChild(chip);
      }
    }

    function renderEmpty(message) {
      resultsEl.innerHTML = `<div class="empty">${message}</div>`;
    }

    function renderNotices(meta) {
      const notices = [];
      if (envDebug && envDebug.openaiConfigured === false) {
        notices.push('Image AI fallback mode is active (OpenAI key missing/invalid).');
      }
      if (imageInferenceWarning) {
        notices.push(imageInferenceWarning);
      }
      if (latestImageInference && latestImageInference.query) {
        notices.push(`Image query: "${latestImageInference.query}".`);
        if (Array.isArray(latestImageInference.queries) && latestImageInference.queries.length > 1) {
          notices.push(`Image alternatives: ${latestImageInference.queries.slice(1, 3).join(' | ')}.`);
        }
      }
      if (meta && meta.cacheUsed) {
        notices.push('Showing cached results for non-eBay sources.');
      }
      if (meta && meta.luxuryRescueUsed) {
        notices.push('Luxury rescue retry was used for Grailed/Vestiaire.');
      }
      if (meta && meta.relaxedFallbackUsed) {
        notices.push('Some matches were broadened because sources timed out.');
      }
      relaxedNoticeEl.textContent = notices.join(' ');
    }

    function renderResults(results) {
      resultsEl.innerHTML = '';

      results.forEach((result) => {
        const card = document.createElement('article');
        card.className = 'card';
        const imageUrl = getSafeImageUrl(result.imageUrl);
        const imageMarkup = imageUrl
          ? `<div class="card-media"><img loading="lazy" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(result.title)}" onerror="this.closest('.card-media').classList.add('no-image'); this.remove();" /></div>`
          : `<div class="card-media no-image"></div>`;
        card.innerHTML = `
          ${imageMarkup}
          <div class="card-body">
            <div class="chips">
              <span class="chip">${escapeHtml(result.platform)}</span>
              <span class="chip">${escapeHtml(result.location)}</span>
            </div>
            <h3 class="card-title">${escapeHtml(result.title)}</h3>
            <div class="price-block">
              <span class="total">${formatMoney(result.total)}</span>
              <span class="price-detail">total landed price</span>
            </div>
            <div class="card-meta">Item ${formatMoney(result.price)} + shipping ${formatMoney(result.shipping)} to ${result.buyerLocation}</div>
            <div class="card-note">${escapeHtml(result.shippingNote)}. Seller side: ${escapeHtml(result.sellerCountry || 'Unknown')}.</div>
          </div>
        `;
        card.onclick = () => window.open(result.url, '_blank', 'noopener');
        resultsEl.appendChild(card);
      });
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('Could not read image file.'));
        reader.readAsDataURL(file);
      });
    }

    function resizeImageDataUrl(dataUrl, maxSide = 1280, quality = 0.86) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const width = Math.max(1, Math.round(img.width * scale));
          const height = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          if (!ctx) {
            reject(new Error('Canvas context unavailable.'));
            return;
          }
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('Could not decode image.'));
        img.src = dataUrl;
      });
    }

    async function inferQueryFromImage(itemHint = '') {
      const file = imageInputEl.files && imageInputEl.files[0];
      if (!file) {
        return null;
      }

      const dataUrl = await readFileAsDataUrl(file);
      const compressed = await resizeImageDataUrl(dataUrl);

      const res = await fetch('/image/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          imageDataUrl: compressed,
          itemHint,
          fileName: file.name || ''
        })
      });

      if (!res.ok) {
        let message = `Image analysis failed (${res.status}).`;
        try {
          const payload = await res.json();
          if (payload && payload.error) {
            message = payload.error;
          }
        } catch (error) {
          const text = await res.text();
          if (text) {
            message = text;
          }
        }
        throw new Error(message);
      }

      return res.json();
    }

    async function fetchSearchJson(params) {
      const res = await fetch(`/search?${params.toString()}`);
      if (!res.ok) {
        throw new Error(`Request failed with status ${res.status}`);
      }
      return res.json();
    }

    function mergeSearchPayloads(payloads) {
      const deduped = [];
      const seen = new Set();
      const mergedMeta = {
        totalFound: 0,
        destination: null,
        sources: {
          vinted: 0,
          ebay: 0,
          wallapop: 0,
          grailed: 0,
          vestiaireCollective: 0
        },
        timeouts: {
          vinted: false,
          ebay: false,
          wallapop: false,
          grailed: false,
          vestiaireCollective: false
        },
        skipped: {}
      };

      payloads.forEach((payload) => {
        const results = payload && Array.isArray(payload.results) ? payload.results : [];
        const meta = payload && payload.meta ? payload.meta : {};

        results.forEach((result) => {
          const key = (result.url || '').trim();
          if (!key || seen.has(key)) {
            return;
          }
          seen.add(key);
          deduped.push(result);
        });

        if (meta.destination && !mergedMeta.destination) {
          mergedMeta.destination = meta.destination;
        }

        Object.keys(mergedMeta.sources).forEach((sourceKey) => {
          mergedMeta.sources[sourceKey] += Number((meta.sources && meta.sources[sourceKey]) || 0);
        });

        Object.keys(mergedMeta.timeouts).forEach((sourceKey) => {
          mergedMeta.timeouts[sourceKey] = mergedMeta.timeouts[sourceKey] || Boolean(meta.timeouts && meta.timeouts[sourceKey]);
        });

        mergedMeta.skipped = { ...mergedMeta.skipped, ...(meta.skipped || {}) };
      });

      deduped.sort((a, b) => Number(a.total || 0) - Number(b.total || 0));
      mergedMeta.totalFound = deduped.length;
      return { results: deduped, meta: mergedMeta };
    }

    async function search() {
      let item = fields.item.value.trim();
      latestImageInference = null;
      imageInferenceWarning = '';

      let imageQueryCandidates = [];

      if (imageInputEl.files && imageInputEl.files[0]) {
        try {
          setLoadingState(true, 'Analyzing image for a precise query');
          const imageInference = await inferQueryFromImage(item);
          latestImageInference = imageInference;
          if (imageInference && imageInference.warning) {
            imageInferenceWarning = imageInference.warning;
          }
          imageQueryCandidates = Array.isArray(imageInference && imageInference.queries)
            ? imageInference.queries.filter(Boolean)
            : [];

          if (imageInference && imageInference.ok && imageInference.query) {
            const inferred = imageInference.query.trim();
            if (!item) {
              fields.item.value = inferred;
            } else if (!item.toLowerCase().includes(inferred.toLowerCase())) {
              fields.item.value = `${item} ${inferred}`.trim();
            }
            item = fields.item.value.trim();
          }
        } catch (error) {
          imageInferenceWarning = `Image analysis error: ${error.message || 'unknown error'}. Continuing with text search.`;
        }
      }

      if (!item) {
        setLoadingState(false, 'Add an item first.');
        renderEmpty('No search yet.');
        return;
      }

      setLoadingState(true, 'Gathering listings');
      relaxedNoticeEl.textContent = '';
      resultsTitleEl.textContent = 'Searching';
      resultsMetaEl.textContent = 'Pulling live marketplace results.';
      resultsEl.innerHTML = '';
      sourceStatsEl.innerHTML = '';

      if (activeStream) {
        activeStream.close();
        activeStream = null;
      }

      try {
        const params = getParams();
        const shouldUseImageBurst =
          imageInputEl.files &&
          imageInputEl.files[0] &&
          imageQueryCandidates.length > 1 &&
          !fields.size.value.trim() &&
          !fields.excludeWords.value.trim();

        if (shouldUseImageBurst) {
          const candidates = imageQueryCandidates.slice(0, 3);
          setLoadingState(true, `Running image burst search (${candidates.length} query angles)`);

          const payloads = await Promise.all(
            candidates.map((candidate) => {
              const burstParams = new URLSearchParams(params.toString());
              burstParams.set('item', candidate);
              return fetchSearchJson(burstParams);
            })
          );

          const merged = mergeSearchPayloads(payloads);
          const results = merged.results || [];
          const meta = merged.meta || null;
          renderNotices(meta);
          renderStats(meta);
          resultsTitleEl.textContent = `"${item}"`;
          resultsMetaEl.textContent = meta
            ? `${meta.totalFound} matches from image burst.${meta.destination && meta.destination.known ? ` Shipping estimated to ${meta.destination.input}.` : ''}`
            : `${results.length} matches found.`;

          if (!results.length) {
            setLoadingState(false, 'No close matches. Try a clearer product photo.');
            renderEmpty('No close visual matches this round.');
            return;
          }

          setLoadingState(false, 'Image burst search complete.');
          renderResults(results);
          return;
        }

        const streamUrl = `/search/stream?${params.toString()}`;

        if (!window.EventSource) {
          const res = await fetch(`/search?${params.toString()}`);
          if (!res.ok) {
            throw new Error(`Request failed with status ${res.status}`);
          }
          const data = await res.json();
          const results = data.results || [];
          const meta = data.meta || null;
          renderNotices(meta);
          renderStats(meta);
          resultsTitleEl.textContent = `"${item}"`;
          resultsMetaEl.textContent = meta
            ? `${meta.totalFound} matches after filtering.${meta.destination && meta.destination.known ? ` Shipping estimated to ${meta.destination.input}.` : ''}`
            : `${results.length} matches found.`;
          if (!results.length) {
            setLoadingState(false, 'No close matches. Try loosening filters.');
            renderEmpty('Nothing survived the filters this round.');
            return;
          }
          setLoadingState(false, 'Live search complete.');
          renderResults(results);
          return;
        }

        const stream = new EventSource(streamUrl);
        activeStream = stream;
        let streamDone = false;

        stream.addEventListener('start', (event) => {
          const payload = JSON.parse(event.data || '{}');
          setLoadingState(true, payload.message || 'Streaming results');
        });

        stream.addEventListener('source_results', (event) => {
          const payload = JSON.parse(event.data || '{}');
          const meta = payload.meta || null;
          const results = payload.results || [];

          renderStats(meta);
          renderNotices(meta);
          resultsTitleEl.textContent = `"${item}"`;
          resultsMetaEl.textContent = meta
            ? `${meta.totalFound} matches so far.${meta.destination && meta.destination.known ? ` Shipping estimated to ${meta.destination.input}.` : ''}`
            : `${results.length} matches so far.`;

          setLoadingState(true, payload.label ? `${payload.label} finished` : 'Received more results');

          if (results.length) {
            renderResults(results);
          }
        });

        stream.addEventListener('source_timeout', (event) => {
          const payload = JSON.parse(event.data || '{}');
          setLoadingState(true, `${payload.label || 'A source'} timed out`);
        });

        stream.addEventListener('done', (event) => {
          streamDone = true;
          const payload = JSON.parse(event.data || '{}');
          const results = payload.results || [];
          const meta = payload.meta || null;

          renderStats(meta);
          renderNotices(meta);
          resultsTitleEl.textContent = `"${item}"`;
          resultsMetaEl.textContent = meta
            ? `${meta.totalFound} matches after filtering.${meta.destination && meta.destination.known ? ` Shipping estimated to ${meta.destination.input}.` : ''}`
            : `${results.length} matches found.`;

          if (!results.length) {
            setLoadingState(false, 'Nothing survived the filters this round.');
            renderEmpty('Nothing survived the filters this round.');
          } else {
            setLoadingState(false, 'Live search complete.');
            renderResults(results);
          }

          stream.close();
          if (activeStream === stream) {
            activeStream = null;
          }
        });

        stream.addEventListener('error', () => {
          if (streamDone) {
            return;
          }

          setLoadingState(false, 'Stream interrupted. Showing current results.');
          stream.close();
          if (activeStream === stream) {
            activeStream = null;
          }
        });
      } catch (error) {
        setLoadingState(false, 'Cannot reach the app server. Start npm.cmd start and reload.');
        relaxedNoticeEl.textContent = '';
        resultsTitleEl.textContent = 'Connection Problem';
        resultsMetaEl.textContent = 'The browser could not reach the backend.';
        renderEmpty('The site could not connect to the search server.');
      }
    }

    function resetFilters() {
      fields.platform.value = 'all';
      fields.sort.value = 'lowest-total';
      fields.maxPrice.value = '';
      fields.size.value = '';
      fields.condition.value = 'all';
      fields.excludeWords.value = '';
      imageInputEl.value = '';
      latestImageInference = null;
      setLoadingState(false, 'Filters reset.');
      relaxedNoticeEl.textContent = '';
      sourceStatsEl.innerHTML = '';
      if (activeStream) {
        activeStream.close();
        activeStream = null;
      }
    }

    document.getElementById('searchButton').addEventListener('click', search);
    document.getElementById('resetButton').addEventListener('click', resetFilters);
    fields.item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        search();
      }
    });
    fields.location.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        search();
      }
    });

    loadEnvDebug().finally(() => {
      renderNotices(null);
    });
    renderEmpty('Search results will appear here.');
  </script>
</body>
</html>
